
`<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latest News | Guna Media Hub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- HEADER -->

<header class="header">

    <h1>📰 Latest News</h1>

    <p>Stay Updated Every Day</p>

</header>


<!-- NEWS ARTICLES -->

<section class="news-container" id="newsContainer">

    <!-- News articles will appear here -->

</section>


<!-- FOOTER -->

<footer>

    <p>© 2026 Guna Media Hub</p>

</footer>


<!-- BOTTOM MOBILE NAVIGATION -->

<nav class="bottom-nav">

    <a href="index.html">
        <span>🏠</span>
        <small>Home</small>
    </a>

    <a href="news.html" class="active">
        <span>📰</span>
        <small>News</small>
    </a>

    <a href="videos.html">
        <span>🎥</span>
        <small>Videos</small>
    </a>

    <a href="profile.html">
        <span>👤</span>
        <small>Profile</small>
    </a>

</nav>


<!-- CONTENT DATA -->

<script src="content.js"></script>


<!-- NEWS JAVASCRIPT -->

<script>

const newsContainer = document.getElementById("newsContainer");

const newsArticles = articles.filter(article =>
    article.category === "News"
);


newsArticles.forEach(article => {

    const card = document.createElement("div");

    card.className = "news-card";

    card.innerHTML = `

        <img
            src="${article.image}"
            alt="${article.title}"
        >

        <div class="news-content">

            <h2>
                ${article.title}
            </h2>

            <p>
                ${article.description}
            </p>

            <a
                href="${article.link}"
                class="read-more"
            >
                Read More →
            </a>

        </div>

    `;

    newsContainer.appendChild(card);

});

</script>


</body>

</html>
